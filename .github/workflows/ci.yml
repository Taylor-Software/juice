name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # polarity_grammar is a private git dependency (see pubspec.yaml) — needs a PAT to clone
      - name: Configure git for private dependency access
        run: git config --global url."https://x-access-token:${{ secrets.PRACTICAL_MAGIC_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
